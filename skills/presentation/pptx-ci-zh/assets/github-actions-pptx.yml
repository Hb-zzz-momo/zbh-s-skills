name: pptx-ci
on: [push, pull_request]
jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils
      - run: pip install python-pptx Pillow defusedxml markitdown[pptx]
      - run: npm ci --prefix skills/presentation/pptx-builder-zh
      - run: npm test --prefix skills/presentation/pptx-builder-zh
      - run: python -m unittest discover -s skills/presentation/ppt-workflow-orchestrator-zh/tests
      - run: python -m unittest discover -s skills/presentation/ppt-data-storytelling-zh/tests
      - run: python -m unittest discover -s skills/presentation/ppt-render-qa-zh/tests
      - run: python -m unittest discover -s skills/presentation/pptx-template-editor-zh/tests
